<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>지금은 충전중</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app">
    <button class="sound-toggle" id="soundToggleBtn" aria-label="소리 켜기">🔈</button>
    <button class="review-toggle" id="reviewToggleBtn" aria-label="돌아보기">📖</button>

    <section class="screen" id="screenState">
      <h1>지금은 충전중</h1>
      <p class="subtitle">지금 기분이 어떤가요?</p>
      <div class="state-grid" id="stateGrid"></div>
    </section>

    <section class="screen" id="screenReview">
      <h1>돌아보기</h1>
      <p class="subtitle">지금까지 남긴 기록이에요</p>
      <div class="review-list" id="reviewList"></div>
      <button class="btn-secondary" id="reviewBackBtn">처음으로</button>
    </section>

    <section class="screen" id="screenBattery">
      <h1>지금 배터리</h1>
      <div class="battery-wrap">
        <div class="battery-shell">
          <div class="battery-fill" id="batteryFill" style="width:0%"></div>
        </div>
        <div class="battery-percent" id="batteryPercent"></div>
        <div class="message-card" id="batteryMessage"></div>
      </div>
      <button class="btn-primary" id="goToPracticeBtn">잠깐 충전하러 가기</button>
    </section>

    <section class="screen" id="screenPractice">
      <h1>어떻게 쉬어볼까요</h1>
      <p class="subtitle">하고 싶은 걸 골라보세요</p>
      <div class="practice-list" id="practiceList"></div>
      <p class="subtitle" style="margin-bottom:12px;">얼마나 쉴까요</p>
      <div class="duration-row">
        <button class="duration-chip" data-min="1">1분</button>
        <button class="duration-chip" data-min="3">3분</button>
        <button class="duration-chip" data-min="5">5분</button>
      </div>
      <button class="btn-primary" id="startPracticeBtn" disabled>시작하기</button>
    </section>

    <section class="screen" id="screenTimer">
      <div class="timer-wrap">
        <div class="timer-ring" id="timerRing">
          <div class="timer-ring-inner" id="timerCount">0:00</div>
        </div>
        <p class="cue-text" id="timerCue"></p>
        <button class="btn-secondary" id="stopPracticeBtn">그만하기</button>
      </div>
    </section>

    <section class="screen" id="screenFinish">
      <div class="finish-wrap" id="finishWrap">
        <div class="finish-emoji">🔋</div>
        <p id="finishMessage">조금이라도 충전됐길 바라요.</p>
        <p class="finish-log" id="finishLog"></p>
        <input
          type="text"
          class="note-input"
          id="noteInput"
          placeholder="오늘 하루, 한 줄로 남겨볼까요? (안 써도 돼요)"
          maxlength="80"
        />
        <div class="finish-actions">
          <button class="btn-primary" id="restartBtn">다시 상태 고르기</button>
          <button class="btn-secondary" id="closeBtn">그냥 쉴래요</button>
        </div>
      </div>
    </section>

  </div>

  <script src="js/states.js"></script>
  <script src="js/restPractices.js"></script>
  <script src="js/sound.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
