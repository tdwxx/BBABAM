<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BBABAM</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 480px;
      margin: 40px auto;
      padding: 0 16px;
      text-align: center;
    }
    #preview, #result {
      max-width: 100%;
      margin-top: 16px;
      border-radius: 8px;
    }
    button {
      margin-top: 12px;
      padding: 8px 16px;
      font-size: 14px;
      cursor: pointer;
    }
    #status {
      margin-top: 8px;
      font-size: 14px;
      color: #666;
    }
  </style>
</head>
<body>
  <h1>픽셀 캐릭터 만들기</h1>
  <p>사진을 올리면 스타듀밸리 스타일 픽셀 캐릭터로 바꿔드려요.</p>

  <input type="file" id="fileInput" accept="image/*" />
  <br />
  <img id="preview" hidden />
  <br />
  <button id="generateBtn" disabled>캐릭터 만들기</button>
  <div id="status"></div>
  <img id="result" hidden />

  <script>
    const fileInput = document.getElementById('fileInput');
    const preview = document.getElementById('preview');
    const generateBtn = document.getElementById('generateBtn');
    const statusEl = document.getElementById('status');
    const resultEl = document.getElementById('result');

    let selectedBase64 = '';
    let selectedMimeType = '';

    fileInput.addEventListener('change', () => {
      const file = fileInput.files[0];
      if (!file) return;

      selectedMimeType = file.type;
      const reader = new FileReader();
      reader.onload = () => {
        const dataUrl = reader.result;
        selectedBase64 = dataUrl.split(',')[1];
        preview.src = dataUrl;
        preview.hidden = false;
        generateBtn.disabled = false;
        resultEl.hidden = true;
        statusEl.textContent = '';
      };
      reader.readAsDataURL(file);
    });

    generateBtn.addEventListener('click', async () => {
      generateBtn.disabled = true;
      statusEl.textContent = '캐릭터 생성 중... (몇 초 걸릴 수 있어요)';
      resultEl.hidden = true;

      try {
        const res = await fetch('/api/generate-character', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            imageBase64: selectedBase64,
            mimeType: selectedMimeType,
          }),
        });

        const data = await res.json();
        if (!res.ok) {
          throw new Error(data.error || '알 수 없는 오류');
        }

        resultEl.src = `data:${data.mimeType};base64,${data.imageBase64}`;
        resultEl.hidden = false;
        statusEl.textContent = '완성!';
      } catch (err) {
        statusEl.textContent = `오류: ${err.message}`;
      } finally {
        generateBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
